name: Build LocalWave IPA

on:
  workflow_dispatch:  # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: macos-15  # newer runner, ships newer Xcode versions

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app  # adjust based on above listing

      - name: List schemes
        run: xcodebuild -list -project localwave.xcodeproj

      - name: Build unsigned .app
        run: |
          xcodebuild -project localwave.xcodeproj \
            -scheme musicapp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            -derivedDataPath build \
            clean build
      - name: Inspect app bundle for icons
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1)
          echo "App path: $APP_PATH"
          ls -la "$APP_PATH"
          echo "--- Info.plist icon keys ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP_PATH/Info.plist" 2>&1 || echo "No CFBundleIcons key found"
          echo "--- Looking for AppIcon assets ---"
          ls "$APP_PATH" | grep -i icon || echo "No icon files found in bundle"

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/localwave.app Payload/
          zip -r localwave.ipa Payload
      - name: List build products
        run: ls build/Build/Products/Release-iphoneos/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: localwave-ipa
          path: localwave.ipa
